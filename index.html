<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Notes App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Header -->
    <header>
      <h1>My Notes</h1>
      <nav>
        <a href="#main-content">Home</a>
        <a href="#site-footer">Contact</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content">

      <!-- Form to Add / Edit Notes -->
      <section class="card">
        <h2 id="form-title">Add Note</h2>
        <form id="note-form">
          <input type="hidden" id="note-index" value="-1" />

          <div class="field">
            <label for="note-title">Title</label>
            <input type="text" id="note-title" required />
          </div>

          <div class="field">
            <label for="note-body">Content</label>
            <textarea id="note-body" required></textarea>
          </div>

          <button type="submit" id="save-btn">Save Note</button>
        </form>
      </section>

      <!-- Display Notes -->
      <section class="card">
        <h2>Saved Notes</h2>
        <div id="notes-list"></div>
      </section>

    </main>

    <!-- Footer -->
    <footer id="site-footer">
      <p>&copy; 2026 My Notes App</p>
      <div class="links">
        <a href="#">Twitter</a>
        <a href="#">GitHub</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
